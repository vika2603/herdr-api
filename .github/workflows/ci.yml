name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- '*_gen.go'
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
